<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>选择小游戏</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
  }

  body {
    background: linear-gradient(180deg, #ffe6ef 0%, #ffd1e3 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
  }

  .container {
    text-align: center;
    width: 100%;
    max-width: 480px;
    position: relative;
    z-index: 2;
  }

  .title {
    font-size: 24px;
    color: #d8689b;
    margin-bottom: 40px;
    font-weight: bold;
  }

  .choice-area {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
  }

  .btn {
    flex: 1;
    padding: 18px 14px;
    border: none;
    border-radius: 24px;
    background: linear-gradient(180deg, #ffb6c1 0%, #ff8fb1 100%);
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 143, 177, 0.45);
    transition: transform 0.15s ease;
  }

  .btn:hover {
    transform: translateY(-3px);
  }

  .btn:active {
    transform: scale(0.96);
  }

  .sad-face {
    font-size: 80px;
    margin-bottom: 12px;
    animation: shake 0.4s ease-in-out;
  }

  .tip-text {
    font-size: 18px;
    color: #d8689b;
    margin-top: 10px;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .end-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
  }

  .end-text {
    font-size: 42px;
    color: #ff8fb1;
    font-weight: bold;
    margin-bottom: 16px;
    text-shadow: 0 0 18px rgba(255, 175, 200, 0.9);
    animation: pop 0.6s ease-out;
  }

  .prize-text {
    font-size: 20px;
    color: #d8689b;
    background: #fff;
    padding: 14px 22px;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(255, 143, 177, 0.35);
    animation: pop 0.8s ease-out;
  }

  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 便便烟花粒子 */
  .particle {
    position: fixed;
    top: 50%;
    left: 50%;
    font-size: 28px;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
  }

  .ring {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffde59 0%, #ff8fb1 60%, transparent 75%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    animation: ringExpand 1.1s ease-out forwards;
  }

  @keyframes ringExpand {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 700px; height: 700px; opacity: 0; }
  }
</style>
</head>

<body>
  <div class="container">
    <div class="title">你更喜欢哪一个？</div>
    <div class="choice-area" id="choiceBox"></div>
  </div>

<script>
  const optionList = [
    "奶茶", "蛋糕", "迪丽热巴", "香奈儿", "火锅",
    "王一博", "草莓", "古驰", "烤肉", "赵露思",
    "冰淇淋", "LV", "易烊千玺", "螺蛳粉", "榴莲"
  ];
  const targetName = "王思奇";

  // 音效
  let cryAudio = null;
  let boomAudio = null;

  function initAudio() {
    cryAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-sad-game-over-trombone-471.mp3");
    boomAudio = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-explosion-bomb-2872.mp3");
  }

  function nextRound() {
    const pickItem = optionList[Math.floor(Math.random() * optionList.length)];
    let left, right;
    if (Math.random() > 0.5) {
      left = pickItem;
      right = targetName;
    } else {
      left = targetName;
      right = pickItem;
    }
    renderButtons(left, right);
  }

  function renderButtons(optA, optB) {
    const box = document.getElementById("choiceBox");
    box.innerHTML = "";

    const btn1 = document.createElement("button");
    btn1.className = "btn";
    btn1.innerText = optA;
    btn1.onclick = () => handleClick(optA);

    const btn2 = document.createElement("button");
    btn2.className = "btn";
    btn2.innerText = optB;
    btn2.onclick = () => handleClick(optB);

    box.appendChild(btn1);
    box.appendChild(btn2);
  }

  // 创建便便炸开粒子
  function poopFirework() {
    const ring = document.createElement("div");
    ring.className = "ring";
    document.body.appendChild(ring);
    setTimeout(()=> ring.remove(),1100);

    const emojiList = ["💩","✨","💖","🌟"];
    for(let i=0; i<36; i++){
      const p = document.createElement("div");
      p.className = "particle";
      p.textContent = emojiList[Math.floor(Math.random()*emojiList.length)];
      const angle = (Math.PI*2 /36)*i;
      const dist = 180 + Math.random()*140;
      const x = Math.cos(angle)*dist;
      const y = Math.sin(angle)*dist;
      p.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      p.style.opacity = 1;
      p.style.transition = "all 0.9s ease-out";
      document.body.appendChild(p);

      setTimeout(()=>{
        p.style.opacity = 0;
      }, 80);
      setTimeout(()=> p.remove(),950);
    }
  }

  function handleClick(selected) {
    initAudio();
    if (selected === targetName) {
      // 通关
      boomAudio.currentTime = 0;
      boomAudio.play().catch(e=>{});
      poopFirework();

      const container = document.querySelector(".container");
      container.innerHTML = `
        <div class="end-screen">
          <div class="end-text">恭喜通关</div>
          <div class="prize-text">领取奖品：一个可爱的王思奇公主</div>
        </div>
      `;
    } else {
      // 选错，哭脸+哭声
      cryAudio.currentTime = 0;
      cryAudio.play().catch(e=>{});
      const container = document.querySelector(".container");
      container.innerHTML = `
        <div class="sad-face">😢</div>
        <div class="tip-text">再选一次吧～</div>
      `;
      setTimeout(() => {
        container.innerHTML = "";
        const title = document.createElement("div");
        title.className = "title";
        title.innerText = "你更喜欢哪一个？";
        container.appendChild(title);
 
        const choiceBox = document.createElement("div");
        choiceBox.className = "choice-area";
        choiceBox.id = "choiceBox";
        container.appendChild(choiceBox);

        nextRound();
      }, 1200);
    }
  }

  nextRound();
</script>
</body>
</html>
